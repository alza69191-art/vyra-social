services:
  - type: web
    name: vyra-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL1
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://alza69191-art.github.io,https://vyra-web.onrender.com,https://vyra-web-rs1b.onrender.com,https://vyra-social-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_API_BASE_URL
        value: https://vyra-api-9pxl.onrender.com
      - key: OAUTH_FRONTEND_URL
        value: https://vyra-web-rs1b.onrender.com

  - type: web
    name: vyra-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_API_URL
        value: https://vyra-api-9pxl.onrender.com
      - key: API_INTERNAL_HOSTPORT
        fromService:
          name: vyra-api
          type: web
          property: hostport
